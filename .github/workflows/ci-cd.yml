name: CI/CD

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore FindMyContacts.sln

    - name: Build
      run: dotnet build FindMyContacts.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test FindMyContacts.sln --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/*.trx

  package-windows-arm64:
    name: Package for Windows ARM64
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore src/FindMyContacts/FindMyContacts.csproj

    - name: Publish for Windows ARM64
      run: |
        dotnet publish src/FindMyContacts/FindMyContacts.csproj \
          --configuration Release \
          --runtime win-arm64 \
          --self-contained true \
          --output ./publish/win-arm64 \
          -p:PublishSingleFile=true \
          -p:EnableCompressionInSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Create archive
      run: |
        cd ./publish/win-arm64
        zip -r ../../FindMyContacts-win-arm64.zip .

    - name: Upload Windows ARM64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: FindMyContacts-win-arm64
        path: FindMyContacts-win-arm64.zip
        retention-days: 30

  release:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: [build, package-windows-arm64]
    if: github.event_name == 'release'

    steps:
    - name: Download Windows ARM64 artifact
      uses: actions/download-artifact@v4
      with:
        name: FindMyContacts-win-arm64

    - name: Upload release asset
      uses: softprops/action-gh-release@v1
      with:
        files: FindMyContacts-win-arm64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Additional build targets for reference
  package-multi-platform:
    name: Package Multi-Platform
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'

    strategy:
      matrix:
        include:
          - runtime: win-x64
            name: Windows x64
          - runtime: linux-x64
            name: Linux x64
          - runtime: linux-arm64
            name: Linux ARM64
          - runtime: osx-x64
            name: macOS x64
          - runtime: osx-arm64
            name: macOS ARM64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore src/FindMyContacts/FindMyContacts.csproj

    - name: Publish for ${{ matrix.name }}
      run: |
        dotnet publish src/FindMyContacts/FindMyContacts.csproj \
          --configuration Release \
          --runtime ${{ matrix.runtime }} \
          --self-contained true \
          --output ./publish/${{ matrix.runtime }} \
          -p:PublishSingleFile=true \
          -p:EnableCompressionInSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Create archive
      run: |
        cd ./publish/${{ matrix.runtime }}
        if [[ "${{ matrix.runtime }}" == win-* ]]; then
          zip -r ../../FindMyContacts-${{ matrix.runtime }}.zip .
        else
          tar -czvf ../../FindMyContacts-${{ matrix.runtime }}.tar.gz .
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FindMyContacts-${{ matrix.runtime }}
        path: FindMyContacts-${{ matrix.runtime }}.*
        retention-days: 30
